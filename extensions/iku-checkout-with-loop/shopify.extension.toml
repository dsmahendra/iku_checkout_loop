# Learn more: https://shopify.dev/docs/api/checkout-ui-extensions
#
# 2026-07: Shopify only accepts new checkout UI extension versions on 2026-01 or
# later. Built on Preact + native s-* Polaris web components (which replaced the
# React-based component set). See src/Banner.tsx for the implementation.
api_version = "2026-07"

[[extensions]]
name = "IKU checkout with loop"
handle = "iku-checkout-with-loop"
uid = "51246297-87b7-202b-51e3-c51417d8e3a6d43046e1"
type = "ui_extension"

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
  module = "./src/Banner.tsx"

  [extensions.capabilities]
  # Required to call the Storefront API's `query()` from useApi() (Step 1 of Loop's
  # upgrade-to-subscription-block guide: fetching eligible selling plans per cart line).
  api_access = true
  # Lets the extension hold the buyer on the current step (e.g. disable "Pay now") while
  # the eligibility check is still running, via useBuyerJourneyIntercept. Note: this API is
  # deprecated in favour of server-side checkout validation Functions, but still works on
  # the pinned 2025-07 version and is proportional to this UX-only guard.
  block_progress = true

  [extensions.settings]

    [[extensions.settings.fields]]
    key = "banner_title"
    type = "single_line_text_field"
    name = "Banner title"
    description = "Title shown above the subscription options."

    [[extensions.settings.fields]]
    key = "banner_image"
    type = "single_line_text_field"
    name = "Banner image URL"
    description = "Optional. Paste an image URL (upload it under Content > Files in Shopify Admin first, then copy its URL)."

    [[extensions.settings.fields]]
    key = "one_time_purchase_note"
    type = "single_line_text_field"
    name = "One-time purchase note"
    description = "Optional text shown under the one-time purchase option (e.g. a shipping note). We don't calculate a real shipping fee here since it isn't known until the address step."

    [[extensions.settings.fields]]
    key = "remote_one_time_purchase_note"
    type = "single_line_text_field"
    name = "One-time purchase note (WA & TAS)"
    description = "Shown instead of the note above when the shipping address is in Western Australia or Tasmania (e.g. a higher shipping cost for remote areas). Requires this app to have Level 2 protected customer data access approved in the Partner Dashboard, otherwise the standard note above is always shown."
